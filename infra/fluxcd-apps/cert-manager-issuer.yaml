---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: adfinis
  namespace: flux-system
spec:
  interval: 50m
  url: https://charts.adfinis.com # Adfinis
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-issuer
  namespace: cert-manager
spec:
  dependsOn:
    - name: cert-manager # Depend on inital cert-manager installation
  releaseName: cert-manager-issuer
  chart:
    spec:
      chart: cert-manager-issuers
      version: '0.3.1'
      sourceRef:
        kind: HelmRepository
        name: adfinis
        namespace: flux-system
  interval: 5m
  values:
    # YAML Anchors for meta configuration
    _1: &email me@lrau.xyz # Personal mail for workshop only
    _2: &solvers
    - http01:
        ingress:
          ingressClassName: traefik

    # Issuer configuration
    clusterIssuers:
    - name: letsencrypt-prod
      spec:
        acme:
          email: *email
          server: https://acme-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: letsencrypt-prod-account-key
          solvers: *solvers
    - name: letsencrypt-staging
      spec:
        acme:
          email: *email
          server: https://acme-staging-v02.api.letsencrypt.org/directory
          privateKeySecretRef:
            name: letsencrypt-staging-account-key
          solvers: *solvers