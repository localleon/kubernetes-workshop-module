apiVersion: v1
kind: Namespace
metadata:
  name: ingress
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 5m
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: ingress
spec:
  releaseName: traefik
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      version: '42.4.1'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  interval: 50m
  values:
    service:
      enabled: true
      single: true
      spec:
        type: LoadBalancer
      # -- Additional annotations applied to both TCP and UDP services (e.g. for cloud provider specific config)
      annotations: 
        service.beta.kubernetes.io/azure-dns-label-name: aks-dev0-ingress
