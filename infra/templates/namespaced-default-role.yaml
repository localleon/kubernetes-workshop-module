apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workshop-learner
rules:
  - apiGroups: [""]
    resources: [configmaps, pods, persistentvolumeclaims, secrets, services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events, pods/log]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/attach, pods/exec, pods/portforward]
    verbs: [get, create]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, deployments/scale, replicasets, statefulsets, statefulsets/scale]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules, servicemonitors]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policies.kyverno.io]
    resources: [namespacedvalidatingpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [wgpolicyk8s.io]
    resources: [policyreports]
    verbs: [get, list, watch]
