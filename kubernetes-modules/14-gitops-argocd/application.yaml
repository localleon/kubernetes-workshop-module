apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workshop
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/YOUR_NAME/kubernetes-workshop-module.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd-demo
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-web
  namespace: argocd
spec:
  project: workshop
  source:
    repoURL: https://github.com/YOUR_NAME/kubernetes-workshop-module.git
    targetRevision: argocd-demo
    path: kubernetes-modules/14-gitops-argocd/app
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-demo
