apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-toolbox
spec:
  podSelector:
    matchLabels:
      app: network-demo
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: toolbox
      ports:
        - protocol: TCP
          port: 8080
