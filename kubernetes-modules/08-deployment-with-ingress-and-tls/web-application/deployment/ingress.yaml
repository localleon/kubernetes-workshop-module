apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-application
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - workshop.example.test
      secretName: web-application-tls
  rules:
    - host: workshop.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-application-int
                port:
                  number: 80
