apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: declarative-deploy
  name: declarative-deploy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: declarative-deploy
  template:
    metadata:
      labels:
        app: declarative-deploy
    spec:
      containers:
      - image: ghcr.io/nginx/nginx-unprivileged:1.30.2-alpine@sha256:de3e40ec8b7debd7194fc798d4bbfb102c7f8b012b2c73032816b5f72393acdd
        name: nginx
