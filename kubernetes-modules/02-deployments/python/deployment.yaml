apiVersion: apps/v1
kind: Deployment
metadata:
  name: workshop-python
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workshop-python
  template:
    metadata:
      labels:
        app: workshop-python
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: python
          image: workshop-python:v1
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
